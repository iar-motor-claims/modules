{{- range $service, $config := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modules.fullname" $ }}-{{ $service }}
  labels:
    {{- include "modules.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service }}
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $.Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "modules.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $service }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
      labels:
        {{- include "modules.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $service }}
    spec:
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "modules.serviceAccountName" $ }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: {{ $service }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          image: "{{ $.Values.image.registry }}/{{ $service }}:{{ $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $.Values.service.targetPort }}
              protocol: TCP
          {{- if $.Values.healthChecks.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ $.Values.healthChecks.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.healthChecks.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.healthChecks.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ $.Values.healthChecks.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: {{ $.Values.healthChecks.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.healthChecks.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.healthChecks.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ $.Values.healthChecks.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          env:
            - name: ENVIRONMENT
              value: {{ $.Values.global.environment }}
            - name: TZ
              value: {{ $.Values.global.timezone }}
            {{- with $.Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $.Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ $.Values.persistence.mountPath }}
          {{- end }}
      {{- if $.Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "modules.fullname" $ }}-{{ $service }}-pvc
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
