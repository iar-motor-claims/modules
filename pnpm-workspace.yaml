packages:
  - "packages/*"
  - "services/*"
  - "tools/*"

catalogs:
  # ============================================================================
  # Default Catalog - Shared across all packages (accessed via catalog:)
  # ============================================================================
  default:
    # Workspace tooling
    typescript: 5.9.2
    prettier: ^3.6.2
    eslint: ^9.38.0
    "@types/node": ^22.15.3

    # Build tools
    vite: ^6.0.5
    vitest: ^2.1.8
    tailwindcss: ^4.1.16
    "@tailwindcss/postcss": ^4.1.16
    postcss: ^8.5.6
    autoprefixer: ^10.4.20

    # Shared runtime utilities
    dayjs: ^1.11.18
    axios: ^1.12.2
    clsx: ^2.1.1

    # Validation
    zod: ^4.1.13

    # State management
    zustand: ^5.0.0

    # UI components
    flatpickr: ^4.6.13
    wavesurfer.js: ^7.12.1

    # shadcn/ui dependencies
    "class-variance-authority": ^0.7.1
    "tailwind-merge": ^3.5.0
    "tw-animate-css": ^1.4.0
    "radix-ui": ^1.4.3
    "recharts": ^2.15.4
    "@fontsource-variable/geist": ^5.2.8

    # i18n
    i18next: ^25.0.0
    react-i18next: ^15.0.0
    i18next-browser-languagedetector: ^8.0.0

    # E2E Testing
    "@playwright/test": ^1.57.0

  # ============================================================================
  # React 19 Catalog (accessed via catalog:react19)
  # ============================================================================
  react19:
    react: 19.2.0
    react-dom: 19.2.0
    "@types/react": 19.2.9
    "@types/react-dom": 19.1.1

    # Next.js (React 19 compatible)
    next: ^16.1.2
    eslint-config-next: 16.1.2

    # React Icons
    lucide-react: ^0.555.0
    "@phosphor-icons/react": ^2.1.10

  # ============================================================================
  # Testing Catalog (accessed via catalog:testing)
  # ============================================================================
  testing:
    "@testing-library/react": ^16.1.0
    "@testing-library/jest-dom": ^6.6.3
    "@testing-library/user-event": ^14.5.0
    jsdom: ^25.0.1
